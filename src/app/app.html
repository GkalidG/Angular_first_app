<div class="flex min-h-screen font-sans bg-gray-50">
  <!-- Sidebar Navigation -->
  <aside class="flex flex-col w-64 p-6 bg-slate-900 text-white shrink-0">
    <h2 class="text-2xl font-bold text-blue-400 mb-8">ShopAdmin</h2>

    <nav class="grow">
      <ul class="space-y-4">
        <!-- routerLink handles SPA navigation without reloading -->
        <li>
          <a
            routerLink="/products"
            routerLinkActive="text-white font-semibold border-l-4 border-blue-500 pl-2"
            class="block cursor-pointer text-gray-300 hover:text-white"
          >
            Products
          </a>
        </li>
        <li>
          <a
            routerLink="/cart"
            routerLinkActive="text-white font-semibold border-l-4 border-blue-500 pl-2"
            class="block cursor-pointer text-gray-300 hover:text-white"
          >
            Cart View
          </a>
        </li>
        <li>
          <a
            routerLink="/admin"
            routerLinkActive="text-white font-semibold border-l-4 border-blue-500 pl-2"
            class="block cursor-pointer text-gray-300 hover:text-white"
          >
            Admin Dashboard 🔐
          </a>
        </li>
      </ul>
    </nav>

    <!-- Auth Status Widget -->
    <div class="pt-4 border-t border-slate-800">
      @if (authService.isAuthenticated()) {
        <p class="text-sm text-gray-300 mb-2">
          Logged in as <span class="font-semibold text-white">Admin</span>
        </p>
        <button
          (click)="logout()"
          class="w-full px-3 py-1.5 text-xs font-semibold text-center text-red-400 bg-red-950/30 rounded border border-red-900/50 hover:bg-red-950/60 transition cursor-pointer"
        >
          Logout
        </button>
      } @else {
        <a
          routerLink="/login"
          class="block w-full px-3 py-1.5 text-xs font-semibold text-center text-white bg-blue-600 rounded hover:bg-blue-700 transition"
        >
          Sign In
        </a>
      }
    </div>
  </aside>

  <!-- Router Outlet Main Content Area -->
  <main class="grow p-8">
    <header class="flex items-center justify-between pb-6 mb-8 border-b border-gray-200">
      <h1 class="text-3xl font-bold text-gray-900">E-Commerce Center</h1>
      <div class="px-4 py-2 font-semibold text-sm bg-blue-100 text-blue-800 rounded-full shadow-sm">
        Cart Items: {{ cartService.cartCount() }}
      </div>
    </header>

    <!-- The Active Route Component Renders Here -->
    <router-outlet></router-outlet>
  </main>
</div>
