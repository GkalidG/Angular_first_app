<article
  class="flex flex-col overflow-hidden bg-white border border-gray-200 rounded-lg shadow-sm transition-all duration-200 hover:-translate-y-1 hover:shadow-md"
>
  <!-- Image Placeholder -->
  <div class="flex items-center justify-center h-40 text-5xl bg-gray-100">🛒</div>

  <!-- Content -->
  <div class="flex flex-col grow p-4">
    <h3 class="text-lg font-semibold text-gray-800">{{ product().name }}</h3>
    <p class="text-xs text-gray-400 mb-2">SKU: {{ product().sku }}</p>
    <p class="text-sm text-gray-600 grow mb-4">{{ product().description }}</p>

    <div class="flex items-center justify-between mt-auto">
      <span class="text-lg font-bold text-gray-900">{{ product().price | currency }}</span>

      @if (product().inStock) {
        <button
          (click)="onAddToCart()"
          class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded hover:bg-blue-700 transition-colors cursor-pointer"
        >
          Add to Cart
        </button>
      } @else {
        <span class="px-2.5 py-1 text-xs font-semibold text-red-600 bg-red-50 rounded">
          Out of Stock
        </span>
      }
    </div>
  </div>
</article>
